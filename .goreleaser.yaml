version: 2
project_name: spothero-pp-cli

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: spothero-pp-cli
    main: ./cmd/spothero-pp-cli
    binary: spothero-pp-cli
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/amansk/spothero-pp-cli/internal/cli.version={{.Version}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
